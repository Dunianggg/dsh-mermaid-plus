name: Release

# Publishing is triggered by a tag, never by a branch push: `git tag v0.3.0 &&
# git push origin v0.3.0` runs the suites, publishes that exact version, and
# opens the GitHub release.
#
# Requires the repository secret NPM_TOKEN: a granular npm access token with
# "Read and write" for this package and "Bypass 2FA" enabled (npm requires 2FA
# for publishing; a plain token is rejected with E403).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run every check but skip npm publish'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Node-side suites
        run: node test/run.mjs

      - name: Real-browser suite
        run: node test/run-e2e-headless.mjs

      - name: Publishable tarball shape
        run: node tools/pack-check.mjs

      - name: Version and tag agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match package.json $version" >&2
            exit 1
          fi

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
